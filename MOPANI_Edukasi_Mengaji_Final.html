            async initCloudData() {
                if (!db) return;
                try {
                    const publicCol = collection(db, `artifacts/${appId}/public/data/mopani_users_v2`);
                    onSnapshot(publicCol, (snapshot) => {
                        const list = [];
                        snapshot.forEach(docSnap => {
                            list.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        appState.usersList = list;
                        if (appState.currentUser && appState.currentUser.role === 'teacher') {
                            app.render();
                        }
                    });
                } catch (e) {
                    console.error("Cloud data sync info:", e);
                }
            },

            async loadStudentProgress(uid) {
                if (!db) return;
                try {
                    const docRef = doc(db, `artifacts/${appId}/users/${uid}/mopani_progress/user_data`);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        appState.progress = data.progress || {};
                        if (data.currentUser) {
                            appState.currentUser = data.currentUser;
                        }
                    }
                } catch (e) {
                    console.error("Load progress info:", e);
                }
            },

            async saveStudentProgress() {
                if (!db || !appState.currentUser || appState.currentUser.role !== 'student') return;
                const uid = appState.currentUser.uid || currentUserAuth?.uid || 'local_student';
                const schoolName = (appState.currentUser.school || 'Umum').trim();
                const payload = {
                    currentUser: appState.currentUser,
                    progress: appState.progress,
                    lastUpdated: new Date().toISOString()
                };
                try {
                    const docRef = doc(db, `artifacts/${appId}/users/${uid}/mopani_progress/user_data`);
                    await setDoc(docRef, payload, { merge: true });

                    const totalPoints = Object.values(appState.progress).reduce((acc, curr) => acc + (curr.score || 0), 0);
                    const completedCount = Object.values(appState.progress).filter(curr => curr.completed).length;
                    
                    const publicRef = doc(db, `artifacts/${appId}/public/data/mopani_users_v2`, uid);
                    await setDoc(publicRef, {
                        name: appState.currentUser.name,
                        className: appState.currentUser.className,
                        school: schoolName,
                        totalPoints: totalPoints,
                        completedMissions: completedCount,
                        lastActive: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.error("Save progress info:", e);
                }

                    appState.selectedLevel = found;
                    appState.activeMission = null;
                    app.render();

            selectMission(mId) {
                if (!appState.selectedLevel) return;
                const found = appState.selectedLevel.missions.find(m => m.id === mId);
                if (found) {
                    appState.activeMission = { ...found, step: 'lesson' };
                    app.render();
                }

            startQuiz(mId) {
                if (appState.activeMission) {
                    appState.activeMission.step = 'quiz';
                    appState.activeMission.currentQuizIdx = 0;
                    appState.activeMission.scoreCount = 0;
                    app.render();
                }
            },

            answerQuiz(selectedIdx, correctIdx, mId, qIdx) {
                const mission = appState.activeMission;
                if (!mission) return;

                const isCorrect = (selectedIdx === correctIdx);
                const feedbackEl = document.getElementById(`quiz-feedback-${qIdx}`);
                const nextBtn = document.getElementById(`next-quiz-btn-${qIdx}`);

                if (isCorrect) {
                    feedbackEl.innerHTML = `<div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-700 font-bold flex items-center space-x-2"><i class="fa-solid fa-circle-check text-lg"></i><span>Jawaban Benar! Hebat sekali! (+10 Poin)</span></div>`;
                    mission.scoreCount = (mission.scoreCount || 0) + 10;
                } else {
                    feedbackEl.innerHTML = `<div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 font-bold flex items-center space-x-2"><i class="fa-solid fa-circle-xmark text-lg"></i><span>Kurang tepat. Jawaban benar: ${mission.quiz[qIdx].options[correctIdx]}</span></div>`;
                }

                const optionBtns = document.querySelectorAll(`.opt-btn-${qIdx}`);
                optionBtns.forEach(btn => btn.disabled = true);
                if (nextBtn) nextBtn.classList.remove('hidden');
            },

            nextQuizStep(mId) {
                const mission = appState.activeMission;
                if (!mission) return;

                if (mission.currentQuizIdx < mission.quiz.length - 1) {
                    mission.currentQuizIdx++;
                    app.render();
                } else {
                    const earnedScore = mission.scoreCount || 10;
                    appState.progress[mId] = { completed: true, score: earnedScore };
                    app.saveStudentProgress();

                    app.showModal('Selamat!', `Misi Berhasil Diselesaikan dengan Gemilang! Anda mendapatkan ${earnedScore} Poin MOPANI.`, 'fa-trophy');
                    appState.activeMission = null;
                    app.render();
                }
            },

            exportData() {
                const teacherSchool = (appState.currentUser?.school || '').trim().toLowerCase();
                const filteredList = appState.usersList.filter(u => (u.school || '').trim().toLowerCase() === teacherSchool);

                let csvContent = `data:text/csv;charset=utf-8,Sekolah/Instansi,Nama Siswa,Kelas,Total Poin,Misi Selesai,Terakhir Aktif\n`;
                filteredList.forEach(u => {
                    csvContent += `"${u.school || '-'}","${u.name}","${u.className}",${u.totalPoints || 0},${u.completedMissions || 0},"${u.lastActive || '-'}"\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Laporan_MOPANI_${appState.currentUser.school.replace(/\s+/g, '_')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            speakText(text) {
                if (!('speechSynthesis' in window)) {
                    app.showModal('Info Audio', 'Maaf, browser tidak mendukung Audio AI Ustadz.', 'fa-circle-info');
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.75;
                utterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(v => v.lang.includes('ar') || v.lang.includes('AR'));
                if (arabicVoice) utterance.voice = arabicVoice;

                window.speechSynthesis.speak(utterance);
            },

                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">5. Al-Waqfu Awla</h4>
                                                    <span class="text-[10px] text-amber-800 font-bold">Utama Berhenti</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Lebih baik berhenti (waqaf), meskipun diperbolehkan untuk diteruskan.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-2xl font-bold text-amber-800 w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm">ط</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">6. Waqaf Mutlaq</h4>
                                                    <span class="text-[10px] text-amber-800 font-bold">Berhenti Sempurna</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Sebaiknya berhenti karena kalimat sudah sempurna, lalu mulai membaca kembali.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-2xl font-bold text-amber-800 w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm">جـ</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">7. Waqaf Mujawwaz</h4>
                                                    <span class="text-[10px] text-slate-600 font-bold">Boleh Berhenti</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Boleh berhenti, namun meneruskan bacaan adalah lebih utama.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-2xl font-bold text-amber-800 w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm">ز</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">8. Waqaf Mujawwaz Kecil</h4>
                                                    <span class="text-[10px] text-slate-600 font-bold">Utama Lanjut</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Lebih utama untuk terus melanjutkan bacaan daripada berhenti.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-2xl font-bold text-amber-800 w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm">ص</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">9. Waqaf Murakhshah</h4>
                                                    <span class="text-[10px] text-slate-600 font-bold">Darurat Berhenti</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Boleh berhenti karena nafas pendek atau darurat, namun lebih utama dilanjutkan.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-2xl font-bold text-amber-800 w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm">قف</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">10. Waqaf Qif</h4>
                                                    <span class="text-[10px] text-amber-800 font-bold">Perintah Berhenti</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Diperintahkan untuk berhenti pada kata tersebut agar pembaca tidak salah paham.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-2xl font-bold text-amber-800 w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm">س</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">11. Saktah (سَكْتَة)</h4>
                                                    <span class="text-[10px] text-amber-800 font-bold">Berhenti Tanpa Ambil Nafas</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Diam sejenak sekadar satu alif (tanpa mengambil nafas baru), lalu meneruskan bacaan.</p>
                                        </div>

                                        <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100">
                                            <div class="flex items-center space-x-3 mb-2">
                                                <span class="font-arabic text-xl font-bold text-amber-800 h-10 px-2 flex items-center justify-center bg-white rounded-xl shadow-sm">؀...؀</span>
                                                <div>
                                                    <h4 class="font-bold text-xs text-slate-900">12. Mu'anaqah (مُعَانَقَة)</h4>
                                                    <span class="text-[10px] text-amber-800 font-bold">Titik Tiga Berpasangan</span>
                                                </div>
                                            </div>
                                            <p class="text-[11px] text-slate-600 leading-relaxed">Berhenti pada salah satu tanda titik tiga tersebut (jangan berhenti di kedua tempat sekaligus).</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Bagian 6: Daftar Lengkap 114 Surah Beserta Jumlah Ayat Sesuai Permintaan -->
                                <div class="bg-white rounded-3xl p-6 shadow-md border border-sunflower-200">
                                    <h3 class="text-base font-extrabold text-slate-900 mb-2 flex items-center space-x-2.5">
                                        <span class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-xs font-bold shadow-sm">6</span>
                                        <span>Daftar Lengkap 114 Surah Al-Qur'an Beserta Jumlah Ayat</span>
                                    </h3>
                                    <p class="text-xs text-slate-500 mb-5 leading-relaxed">Berikut adalah daftar lengkap 114 surah di dalam Al-Qur'an terurut dari Al-Fatihah hingga An-Nas beserta arti dan jumlah ayatnya masing-masing secara akurat:</p>
                                    
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                                        <div class="p-4 bg-emerald-50/50 rounded-2xl border border-emerald-100 text-center">
                                            <span class="text-2xl font-extrabold text-emerald-800 block">30 Juz</span>
                                            <span class="text-xs text-slate-500 font-medium">Pembagian Kitab</span>
                                        </div>
                                        <div class="p-4 bg-emerald-50/50 rounded-2xl border border-emerald-100 text-center">
                                            <span class="text-2xl font-extrabold text-emerald-800 block">114 Surah</span>
                                            <span class="text-xs text-slate-500 font-medium">Keseluruhan Surah</span>
                                        </div>
                                        <div class="p-4 bg-emerald-50/50 rounded-2xl border border-emerald-100 text-center">
                                            <span class="text-2xl font-extrabold text-emerald-800 block">6.236 Ayat</span>
                                            <span class="text-xs text-slate-500 font-medium">Total Keseluruhan Ayat</span>
                                        </div>
                                    </div>

                                    <div class="max-h-[500px] overflow-y-auto border border-sunflower-200 rounded-2xl p-4 bg-slate-50/60 shadow-inner">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 text-xs font-medium">
                                            ${ALL_SURAHS_DATA.map(surah => `
                                                <div class="p-3 bg-white rounded-xl border border-sunflower-100 text-slate-800 shadow-sm flex items-center justify-between hover:border-sunflower-400 transition">
                                                    <span>${surah}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (appState.selectedLevel && !appState.activeMission) {
                    const lvl = appState.selectedLevel;
                    container.innerHTML = `
                        <div class="space-y-6 max-w-2xl mx-auto">
                            <div class="flex items-center justify-between">
                                <button onclick="window._actualApp.goHome()" class="px-4 py-2 bg-white border border-sunflower-300 rounded-xl text-xs font-bold text-slate-700 hover:bg-sunflower-50 transition flex items-center space-x-2 shadow-sm">
                                    <i class="fa-solid fa-arrow-left"></i>
                                    <span>Kembali ke Pilih Level</span>
                                </button>
                                <span class="text-xs font-extrabold bg-sunflower-200 text-amber-900 px-3.5 py-1.5 rounded-full shadow-sm">${lvl.title}</span>
                            </div>

                            <div class="text-center bg-white rounded-3xl p-6 shadow-md border border-sunflower-200">
                                <div class="text-4xl mb-2">${lvl.badge}</div>
                                <h2 class="text-xl font-extrabold text-slate-900">${lvl.title}</h2>
                                <p class="text-xs text-slate-500 mt-1 font-medium">${lvl.subtitle} — Selesaikan semua misi dengan nilai terbaik!</p>
                            </div>

                            <div class="space-y-4">
                                ${lvl.missions.map((m, idx) => {
                                    const isDone = appState.progress[m.id]?.completed;
                                    return `
                                        <div onclick="window._actualApp.selectMission('${m.id}')" class="bg-white rounded-2xl p-5 shadow-md border-2 ${isDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-sunflower-200 hover:border-sunflower-400'} cursor-pointer transition transform hover:-translate-y-0.5 flex items-center justify-between group">
                                            <div class="flex items-center space-x-4">
                                                <div class="w-12 h-12 rounded-2xl ${isDone ? 'bg-emerald-500 text-white' : 'bg-sunflower-100 text-amber-700'} flex items-center justify-center font-bold text-lg shadow-sm">
                                                    ${isDone ? '<i class="fa-solid fa-check"></i>' : (idx + 1)}
                                                </div>
                                                <div>
                                                    <span class="text-[10px] font-bold ${isDone ? 'text-emerald-600' : 'text-amber-600'} uppercase tracking-wider">Misi ${idx + 1} (+10 Poin)</span>
                                                    <h3 class="font-extrabold text-slate-900 text-base group-hover:text-amber-600 transition mt-0.5">${m.title}</h3>
                                                    <p class="text-xs text-slate-500 mt-0.5">${m.desc}</p>
                                                </div>
                                            </div>
                                            <div class="w-10 h-10 rounded-xl bg-sunflower-50 group-hover:bg-sunflower-500 group-hover:text-white text-amber-700 flex items-center justify-center transition shadow-sm">
                                                <i class="fa-solid fa-chevron-right text-xs"></i>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else if (appState.activeMission && appState.activeMission.type === 'certificate') {
                    const totalScore = Object.values(appState.progress).reduce((acc, curr) => acc + (curr.score || 0), 0);
                    container.innerHTML = `
                        <div class="max-w-2xl mx-auto space-y-6">
                            <div class="flex justify-between items-center">
                                <button onclick="window._actualApp.goHome()" class="px-4 py-2 bg-white border border-sunflower-300 rounded-xl text-xs font-bold text-slate-700 hover:bg-sunflower-50 transition flex items-center space-x-2 shadow-sm">
                                    <i class="fa-solid fa-arrow-left"></i>
                                    <span>Kembali ke Beranda</span>
                                </button>
                                <button onclick="window._actualApp.printCertificate()" class="px-5 py-2.5 bg-gradient-to-r from-sunflower-500 to-amber-500 text-white font-bold text-xs rounded-xl shadow-lg hover:from-sunflower-600 hover:to-amber-600 transition flex items-center space-x-2">
                                    <i class="fa-solid fa-print"></i>
                                    <span>Cetak / Unduh Sertifikat</span>
                                </button>
                            </div>

                            <div id="certificate-print-area" class="bg-white rounded-3xl p-8 md:p-12 shadow-2xl border-8 border-sunflower-300 text-center relative overflow-hidden">
                                <div class="absolute top-4 left-4 text-sunflower-300 text-4xl"><i class="fa-solid fa-sun"></i></div>
                                <div class="absolute top-4 right-4 text-sunflower-300 text-4xl"><i class="fa-solid fa-sun"></i></div>

                                <div class="w-20 h-20 bg-gradient-to-tr from-sunflower-400 to-amber-500 rounded-full mx-auto flex items-center justify-center shadow-lg text-white font-arabic text-4xl font-bold mb-4">
                                    م
                                </div>
                                <h4 class="text-xs font-extrabold text-amber-600 uppercase tracking-widest">Sertifikat Penghargaan Resmi MOPANI</h4>
                                <h2 class="text-3xl font-extrabold text-slate-900 font-arabic mt-1">سِيْرَةُ الإِتْقَان وَالتَّخَرُّج</h2>
                                <p class="text-xs text-slate-500 mt-1 font-medium">Misi Pintar Mengaji — MOPANI</p>

                                <p class="text-xs text-slate-600 mt-6 font-medium">Sertifikat kelulusan ini dengan bangga diberikan kepada:</p>
                                <h3 class="text-2xl font-extrabold text-emerald-800 mt-2 underline decoration-sunflower-400 decoration-2">${appState.currentUser.name}</h3>
                                <p class="text-xs text-slate-500 font-bold mt-1">Kelas: ${appState.currentUser.className} • ${appState.currentUser.school}</p>

                                <p class="text-xs text-slate-600 max-w-md mx-auto mt-4 leading-relaxed font-medium">
                                    Telah berhasil menyelesaikan seluruh rangkaian misi pembelajaran membaca Al-Qur'an dan Iqra dengan perolehan prestasi <span class="font-bold text-amber-700">${totalScore} Poin MOPANI</span>.
                                </p>

                                <div class="mt-8 pt-6 border-t border-sunflower-200 flex justify-between items-center text-xs text-slate-500">
                                    <div class="text-left">
                                        <p class="font-bold text-slate-800">Ide & Pengembang:</p>
                                        <p class="text-amber-800 font-bold">🌻 Fidyawati M.I. Banti, S.Pd</p>
                                    </div>
                                    <div class="w-16 h-16 bg-sunflower-100 rounded-full flex items-center justify-center text-amber-700 text-2xl font-bold shadow-inner">
                                        <i class="fa-solid fa-award"></i>
                                    </div>
                                    <div class="text-right">
                                        <p class="font-bold text-slate-800">Tanggal Kelulusan</p>
                                        <p class="font-medium">${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (appState.activeMission) {
                    const m = appState.activeMission;
                    container.innerHTML = `
                        <div class="max-w-2xl mx-auto space-y-6">
                            <div class="flex justify-between items-center">
                                <button onclick="window._actualApp.selectLevel(appState.selectedLevel.id)" class="px-4 py-2 bg-white border border-sunflower-300 rounded-xl text-xs font-bold text-slate-700 hover:bg-sunflower-50 transition flex items-center space-x-2 shadow-sm">
                                    <i class="fa-solid fa-arrow-left"></i>
                                    <span>Kembali ke Daftar Misi</span>
                                </button>
                                <span class="text-xs font-extrabold bg-sunflower-100 text-amber-900 px-3 py-1 rounded-full shadow-sm">${m.title}</span>
                            </div>

                            ${m.step === 'lesson' ? `
                                <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-sunflower-200 space-y-6">
                                    <div class="text-center">
                                        <span class="text-xs font-bold bg-sunflower-100 text-amber-800 px-3.5 py-1.5 rounded-full shadow-sm">Materi Pembelajaran Ustadz AI</span>
                                        <h3 class="text-2xl font-extrabold text-slate-900 mt-2">${m.title}</h3>
                                        <p class="text-xs text-slate-500 mt-1 font-medium">${m.desc}</p>
                                    </div>

                                    <div class="space-y-4">
                                        ${m.lessons.map(l => `
                                            <div class="p-5 rounded-2xl bg-gradient-to-r from-sunflower-50/70 to-amber-50/40 border border-sunflower-200 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
                                                <div class="text-center sm:text-left">
                                                    <span class="font-arabic text-3xl md:text-4xl text-emerald-800 font-bold block mb-1">${l.ar}</span>
                                                    <p class="text-xs font-extrabold text-slate-900">${l.read}</p>
                                                    <p class="text-[11px] text-slate-500 font-medium">${l.desc}</p>
                                                </div>
                                                <button onclick="window._actualApp.speakText('${l.ar}')" class="px-4 py-2.5 bg-sunflower-500 hover:bg-sunflower-600 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-2">
                                                    <i class="fa-solid fa-volume-high"></i>
                                                    <span>Putar Suara Ustadz (AI)</span>
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <button onclick="window._actualApp.startQuiz('${m.id}')" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold text-sm rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-[0.98] flex items-center justify-center space-x-2">
                                        <span>Mulai Tes Kuis Misi (+10 Poin)</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            ` : `
                                <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-sunflower-200 space-y-6">
                                    <div class="flex justify-between items-center border-b border-sunflower-100 pb-4">
                                        <div>
                                            <span class="text-xs font-bold text-amber-600 uppercase tracking-wider">Pertanyaan ${m.currentQuizIdx + 1} dari ${m.quiz.length}</span>
                                            <h3 class="text-lg font-extrabold text-slate-900 mt-0.5">Kuis Evaluasi Misi</h3>
                                        </div>
                                        <button onclick="window._actualApp.speakText('${m.quiz[m.currentQuizIdx].q}')" class="w-10 h-10 rounded-xl bg-sunflower-100 text-amber-800 flex items-center justify-center hover:bg-sunflower-200 transition shadow-sm" title="Dengarkan Pertanyaan">
                                            <i class="fa-solid fa-volume-high text-sm"></i>
                                        </button>
                                    </div>

                                    <div>
                                        <p class="text-base font-bold text-slate-900 mb-4 leading-relaxed">${m.quiz[m.currentQuizIdx].q}</p>
                                        <div class="space-y-3">
                                            ${m.quiz[m.currentQuizIdx].options.map((opt, oIdx) => `
                                                <button onclick="window._actualApp.answerQuiz(${oIdx}, ${m.quiz[m.currentQuizIdx].answer}, '${m.id}', ${m.currentQuizIdx})" 
                                                    class="opt-btn-${m.currentQuizIdx} w-full text-left px-5 py-3.5 rounded-xl border-2 border-sunflower-200 hover:border-sunflower-400 hover:bg-sunflower-50/50 font-semibold text-slate-800 text-sm transition flex justify-between items-center shadow-sm">
                                                    <span>${opt}</span>
                                                    <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-bold text-slate-500 bg-white">${String.fromCharCode(65 + oIdx)}</span>
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <div id="quiz-feedback-${m.currentQuizIdx}" class="text-sm"></div>

                                    <button id="next-quiz-btn-${m.currentQuizIdx}" onclick="window._actualApp.nextQuizStep('${m.id}')" class="hidden w-full py-3.5 bg-gradient-to-r from-sunflower-500 to-amber-500 text-white font-bold text-sm rounded-xl shadow-lg hover:from-sunflower-600 hover:to-amber-600 transition flex items-center justify-center space-x-2">
                                        <span>Lanjutkan Misi Berikutnya</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            `}
                        </div>
                    `;
                }
            }
        };

        window._actualApp = app;

        window.onload = function() {
            app.render();
        };
    </script>
</body>
</html>
